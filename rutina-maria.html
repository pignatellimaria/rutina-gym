<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D9E75">
<title>Mi rutina — María</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f0;color:#1a1a18;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 80px}
.topbar{background:#fff;border-bottom:1px solid #e5e5e0;padding:14px 20px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:17px;font-weight:600}.topbar p{font-size:11px;color:#888;margin-top:1px}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e5e5e0;position:sticky;top:57px;z-index:99;overflow-x:auto}
.tab{flex:1;min-width:55px;padding:11px 3px;font-size:11px;border:none;background:transparent;cursor:pointer;color:#888;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;text-align:center}
.tab.active{color:#1D9E75;border-bottom-color:#1D9E75}
.content{padding:14px}
.month-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.m-pill{padding:9px 4px;border-radius:10px;border:1px solid #e5e5e0;cursor:pointer;text-align:center;background:#fff}
.m-pill.active{background:#1D9E75;border-color:#1D9E75}
.m-pill.active .mn,.m-pill.active .ms{color:#fff}
.mn{font-size:13px;font-weight:600;color:#1a1a18}.ms{font-size:10px;color:#888;margin-top:1px}
.day-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
.d-pill{padding:9px 3px;border-radius:9px;border:1px solid #e5e5e0;cursor:pointer;text-align:center;background:#fff}
.d-pill.active{background:#1D9E75;border-color:#1D9E75}
.d-pill.active .dn,.d-pill.active .df{color:#fff}
.d-pill.opt{border-style:dashed}
.dn{font-size:11px;font-weight:600;color:#1a1a18}.df{font-size:10px;color:#888;margin-top:1px}
.card{background:#fff;border-radius:12px;border:1px solid #e5e5e0;margin-bottom:10px;overflow:hidden}
.card-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.card-title{font-size:13px;font-weight:600;color:#1a1a18;display:flex;align-items:center;gap:6px}
.card-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-green{background:#E1F5EE;color:#085041}
.card-body{padding:0 14px 14px;display:none}.card-body.open{display:block}
.ex-card{background:#fff;border-radius:12px;border:1px solid #e5e5e0;margin-bottom:8px;overflow:hidden}
.ex-card.sp{border-color:#EF9F27}.ex-card.pp{border-color:#1D9E75}
.ex-main{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ex-num{width:24px;height:24px;border-radius:50%;border:1px solid #e5e5e0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#888;flex-shrink:0}
.ex-body{flex:1}.ex-name{font-size:13px;font-weight:600;color:#1a1a18;line-height:1.3}
.ex-card.sp .ex-name{color:#854F0B}.ex-card.pp .ex-name{color:#085041}
.ex-detail{font-size:11px;color:#888;margin-top:2px}
.ex-tempo{font-size:11px;color:#1D9E75;margin-top:2px;font-style:italic}
.ex-fallo{font-size:11px;color:#E24B4A;margin-top:2px;font-weight:600}
.ex-goal{font-size:11px;color:#1D9E75;font-weight:700;margin-top:2px}
.ex-badge{font-size:10px;padding:2px 7px;border-radius:20px;display:inline-block;margin-top:3px;font-weight:600}
.bt{background:#FAEEDA;color:#412402}.bp{background:#E1F5EE;color:#04342C}
.ex-arrow{font-size:16px;color:#ccc;transition:transform 0.15s;flex-shrink:0}
.ex-arrow.open{transform:rotate(180deg)}
.alts-panel{border-top:1px solid #f0f0ec;background:#fafaf8;padding:10px 14px;display:none}
.alts-panel.open{display:block}
.alts-title{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
.alt-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0ec}
.alt-row:last-child{border-bottom:none}
.alt-info{flex:1}.alt-name{font-size:12px;font-weight:500;color:#1a1a18}.alt-why{font-size:11px;color:#888;margin-top:1px}
.alt-btns{display:flex;gap:4px;flex-shrink:0}
.bhoy{font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid #EF9F27;color:#854F0B;background:#FAEEDA;cursor:pointer;font-weight:600;white-space:nowrap}
.bsiempre{font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid #1D9E75;color:#085041;background:#E1F5EE;cursor:pointer;font-weight:600;white-space:nowrap}
.breset{font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid #e5e5e0;color:#888;background:#fff;cursor:pointer;margin-top:8px;display:block;width:100%;text-align:center}
.home-ex{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ec}
.home-ex:last-child{border-bottom:none}
.home-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.home-num.green{background:#E1F5EE;color:#085041}
.home-name{font-size:13px;font-weight:500;color:#1a1a18}.home-detail{font-size:11px;color:#888;margin-top:1px;font-style:italic}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-size:14px;font-weight:600;color:#1a1a18}
.cal-nav{padding:6px 10px;border:1px solid #e5e5e0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px}
.cal-dow{font-size:10px;font-weight:600;color:#888;text-align:center;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:500;border:1px solid transparent;flex-direction:column;gap:1px}
.cal-day.empty{cursor:default}.cal-day.today{border-color:#1D9E75}
.cal-day span{font-size:9px;line-height:1}
.status-gym{background:#E1F5EE;color:#085041}.status-tennis{background:#E8EDFE;color:#1E3A8A}
.status-home{background:#FEF3C7;color:#92400E}.status-sick{background:#FEE2E2;color:#991B1B}
.status-travel{background:#E0E7FF;color:#3730A3}.status-tired{background:#F3F4F6;color:#4B5563}
.status-period{background:#FCE7F3;color:#9D174D}.status-rest{background:#F5F3FF;color:#5B21B6}
.status-none{background:#f5f5f0;color:#888}
.status-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.status-btn{padding:8px 4px;border-radius:8px;border:1px solid #e5e5e0;cursor:pointer;text-align:center;font-size:11px;font-weight:500;background:#fff}
.cal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat-box{background:#fff;border:1px solid #e5e5e0;border-radius:10px;padding:10px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#1D9E75}.stat-label{font-size:10px;color:#888;margin-top:2px}
.antro-card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.antro-title{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.antro-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0ec;font-size:13px}
.antro-row:last-child{border-bottom:none}
.antro-label{color:#888}.antro-val{font-weight:600;color:#1a1a18}.antro-goal{font-size:10px;color:#1D9E75;font-weight:600}
.comp-bar{height:8px;background:#f0f0ec;border-radius:4px;margin-top:6px;overflow:hidden}
.comp-fill{height:100%;border-radius:4px}
.steps-bar-bg{height:8px;background:#f0f0ec;border-radius:4px;margin:8px 0}
.steps-bar{height:8px;border-radius:4px}
.steps-input-row{display:flex;gap:8px;margin-top:10px}
.steps-input{flex:1;padding:9px 12px;border:1px solid #e5e5e0;border-radius:8px;font-size:14px}
.steps-btn{padding:9px 16px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.note-card{background:#E1F5EE;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#085041;line-height:1.5}
.warn-card{background:#FAEEDA;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#7C4A0A;line-height:1.5}
.section-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sdot{width:6px;height:6px;border-radius:50%;background:#1D9E75}
.badge-pill{display:inline-flex;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.05em}
.bb{background:#E1F5EE;color:#085041}.br{background:#EEEDFE;color:#26215C}
.bf{background:#FAECE7;color:#4A1B0C}.bc{background:#E6F1FB;color:#042C53}
.deload{background:#FAEEDA;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px;color:#7C4A0A}
.eval{background:#E1F5EE;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px;color:#085041}
.muscle-figs{display:flex;gap:8px;margin-bottom:10px}
.muscle-fig{flex:1;text-align:center}
.muscle-fig-lbl{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.muscle-fig svg{width:100%;max-width:140px}
.muscle-legend{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.leg-row{display:flex;align-items:center;gap:7px}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-type{font-size:10px;color:#888;font-weight:600;text-transform:uppercase}.leg-name{font-size:12px;color:#1a1a18}
.meal-card{background:#fff;border-radius:12px;border:1px solid #e5e5e0;margin-bottom:8px;overflow:hidden}
.meal-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.meal-title{font-size:14px;font-weight:600;color:#1a1a18}
.meal-time{font-size:11px;color:#888;margin-top:1px}
.meal-body{padding:0 14px 14px;display:none}.meal-body.open{display:block}
.meal-note{font-size:11px;background:#FAEEDA;color:#7C4A0A;padding:7px 10px;border-radius:8px;margin:6px 0 10px}
.meal-note.green{background:#E1F5EE;color:#085041}
.meal-section{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin:10px 0 6px}
.opt-btn{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #e5e5e0;background:#fff;cursor:pointer;margin-bottom:5px;width:100%;text-align:left;font-size:12px;color:#1a1a18;line-height:1.4}
.opt-btn.selected{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.check{width:16px;height:16px;border-radius:50%;border:1.5px solid #e5e5e0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;margin-top:1px}
.opt-btn.selected .check{background:#1D9E75;border-color:#1D9E75;color:#fff}
.free-input{width:100%;padding:8px 10px;border:1px solid #e5e5e0;border-radius:8px;font-size:13px;margin-top:8px;font-family:inherit;background:#fafaf8}
.act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.act-btn{padding:10px 8px;border-radius:8px;border:1px solid #e5e5e0;background:#fff;cursor:pointer;font-size:12px;font-weight:500;text-align:center;color:#1a1a18}
.act-btn.selected{background:#1D9E75;border-color:#1D9E75;color:#fff}
.today-header{background:#fff;border-radius:12px;border:1px solid #e5e5e0;padding:14px;margin-bottom:10px}
.today-date{font-size:15px;font-weight:600;color:#1a1a18;margin-bottom:3px}
.today-note{font-size:12px;color:#888}
.empty{text-align:center;padding:30px 0;color:#aaa;font-size:13px}
</style>
</head>

function renderGym(){
  const m=MONTHS[curMonth];const day=m.days[curDay];const mob=MOBILITY[curDay];
  let h='';
  h+=`<div class="month-strip">`;
  Object.entries(MONTHS).forEach(([k,v])=>{h+=`<div class="m-pill${k===curMonth?' active':''}" onclick="setMonth('${k}',this)"><div class="mn">${v.label}</div><div class="ms">${v.sub}</div></div>`;}); 
  h+=`</div><div class="badge-pill ${m.badge}">${m.label} — ${m.sub}</div>`;
  h+=`<div class="note-card">${m.note}</div>`;
  h+=`<div class="day-strip">`;
  DO.forEach(d=>{const meta=DM[d];h+=`<div class="d-pill${d===curDay?' active':''}${d==='vie'?' opt':''}" onclick="setDay('${d}')"><div class="dn">${meta.n}</div><div class="df">${meta.f}</div></div>`;});
  h+=`</div><div class="section-label"><div class="sdot"></div>${day.label}</div>`;
  h+=`<div class="card"><div class="card-header" onclick="toggleMob()"><div class="card-title">🧘 Movilidad <span class="card-badge badge-green">5-8 min</span></div><span style="color:#ccc">›</span></div><div class="card-body${openMob?' open':''}">`;
  mob.forEach((e,i)=>{h+=`<div class="home-ex"><div class="home-num green">${i+1}</div><div><div class="home-name">${e.n}</div><div class="home-detail">${e.d}</div></div></div>`;});
  h+=`</div></div>`;
  day.exs.forEach((ex,i)=>{
    const key=curMonth+'_'+curDay+'_'+ex.n;
    const isPerm=!!permSwaps[key];const isTemp=!!swaps[key]&&!isPerm;
    const display=isPerm?permSwaps[key].display:isTemp?swaps[key].display:ex.n;
    const cc='ex-card'+(isPerm?' pp':isTemp?' sp':'');
    const badge=isPerm?'<span class="ex-badge bp">Cambio permanente</span>':isTemp?'<span class="ex-badge bt">Solo hoy</span>':'';
    const isOpen=openAlt===ex.n;
    const altsH=ex.alts.map(a=>`<div class="alt-row"><div class="alt-info"><div class="alt-name">${a.n}</div><div class="alt-why">${a.w}</div></div><div class="alt-btns"><button class="bhoy" onclick="doSwap('${ex.n.replace(/'/g,"\'")}',' ${a.n.replace(/'/g,"\'")},false)">Hoy</button><button class="bsiempre" onclick="doSwap('${ex.n.replace(/'/g,"\'")}',' ${a.n.replace(/'/g,"\'")},true)">Siempre</button></div></div>`).join('');
    const resetBtn=(isPerm||isTemp)?`<button class="breset" onclick="resetSwap('${ex.n.replace(/'/g,"\'")}')">Volver al original</button>`:'';
    h+=`<div class="${cc}"><div class="ex-main" onclick="toggleAlt('${ex.n.replace(/'/g,"\'")}')"><div class="ex-num">${i+1}</div><div class="ex-body"><div class="ex-name">${display}</div><div class="ex-detail">${ex.d||''}</div>${ex.t?`<div class="ex-tempo">${ex.t}</div>`:''}${ex.f?`<div class="ex-fallo">⚡ ${ex.f}</div>`:''}${ex.goal?`<div class="ex-goal">🎯 ${ex.goal}</div>`:''}${badge}</div><span class="ex-arrow${isOpen?' open':''}" >›</span></div><div class="alts-panel${isOpen?' open':''}"><div class="alts-title">Alternativas</div>${altsH}${resetBtn}</div></div>`;
  });
  if(m.deload)h+=`<div class="deload"><strong>Semana 4 — descarga:</strong> Solo lunes y miércoles · 2-3 ejercicios · 70% del peso.</div>`;
  if(m.eval)h+=`<div class="eval"><strong>Semana 4 — evaluación final 🎯</strong><br>Nueva antropometría con Marina. Planificás el 2026.</div>`;
  document.getElementById('view-gym').innerHTML=h;
}

function renderCal(){
  const today=new Date();
  const isToday=(y,m,d)=>y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const statusMap={};
  Object.entries(calStatus).forEach(([k,v])=>{const[y,m,d]=k.split('-').map(Number);if(y===calYear&&m===calMonth)statusMap[d]=v;});
  const counts={};STATUS_TYPES.forEach(s=>counts[s.key]=0);
  Object.values(calStatus).forEach(v=>{if(counts[v]!==undefined)counts[v]++;});
  const trainDays=(counts.gym||0)+(counts.tennis||0)+(counts.home||0);
  const justifiedDays=(counts.sick||0)+(counts.travel||0)+(counts.tired||0)+(counts.period||0)+(counts.rest||0);
  let h=`<div class="card" style="padding:14px">`;
  h+=`<div class="cal-header"><button class="cal-nav" onclick="navCal(-1)">‹</button><div class="cal-month">${MONTHS_ES_CAL[calMonth]} ${calYear}</div><button class="cal-nav" onclick="navCal(1)">›</button></div>`;
  h+=`<div class="cal-grid">${['D','L','M','X','J','V','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${Array(firstDay).fill('<div class="cal-day empty"></div>').join('')}`;
  for(let d=1;d<=daysInMonth;d++){
    const key=calYear+'-'+calMonth+'-'+d;
    const st=statusMap[d];const stObj=STATUS_TYPES.find(s=>s.key===st);
    const cls=stObj?stObj.cls:'status-none';
    const todayCls=isToday(calYear,calMonth,d)?'today':'';
    const picking=calPickingDay===key;
    h+=`<div class="cal-day ${cls} ${todayCls}" onclick="pickDay(${calYear},${calMonth},${d})" style="${picking?'outline:2px solid #1D9E75;outline-offset:1px':''}"><span style="font-size:11px;font-weight:600">${d}</span>${stObj?`<span>${stObj.emoji}</span>`:''}</div>`;
  }
  h+=`</div>`;
  if(calPickingDay){
    h+=`<div style="font-size:12px;font-weight:600;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em">¿Qué hiciste este día?</div><div class="status-picker">`;
    h+=STATUS_TYPES.map(s=>`<button class="status-btn ${s.cls}" onclick="setStatus('${calPickingDay}','${s.key}')">${s.emoji}<br>${s.label}</button>`).join('');
    h+=`<button class="status-btn" onclick="setStatus('${calPickingDay}',null)" style="background:#f5f5f0;color:#888">✕<br>Borrar</button></div>`;
  }
  h+=`<div class="cal-stats"><div class="stat-box"><div class="stat-num" style="color:#1D9E75">${trainDays}</div><div class="stat-label">Días activos</div></div><div class="stat-box"><div class="stat-num" style="color:#EF9F27">${justifiedDays}</div><div class="stat-label">Causa justificada</div></div><div class="stat-box"><div class="stat-num" style="color:#9D174D">${counts.period||0}</div><div class="stat-label">Período 🩸</div></div></div>`;
  
  // Pasos within Registro
  const pct=Math.min(100,Math.round((stepsToday/stepsGoal)*100));
  const col=pct>=100?'#1D9E75':pct>=70?'#EF9F27':'#E24B4A';
  h+=`</div><div class="card" style="padding:14px;margin-top:0">`;
  h+=`<div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Pasos diarios 👟</div>`;
  h+=`<div style="font-size:28px;font-weight:700;color:${col}">${stepsToday.toLocaleString()}</div>`;
  h+=`<div style="font-size:11px;color:#888;margin-top:2px">Meta: ${stepsGoal.toLocaleString()} pasos · ${pct}%</div>`;
  h+=`<div class="steps-bar-bg"><div class="steps-bar" style="width:${pct}%;background:${col}"></div></div>`;
  h+=`<div class="steps-input-row"><input id="steps-input" class="steps-input" type="number" placeholder="Ingresá tus pasos"><button class="steps-btn" onclick="saveSteps()">Guardar</button></div></div>`;
  document.getElementById('view-cal').innerHTML=h;
}

function renderComida(){
  const today=new Date();
  const dow=today.getDay();
  const isTennis=TENNIS_DAYS.includes(dow);
  const log=getTodayLog();
  const savedAct=log.activity||'';
  let h='';
  
  h+=`<div class="today-header">
    <div class="today-date">${DAYS_ES[dow]}, ${today.getDate()} de ${MONTHS_ES_N[today.getMonth()]}</div>
    <div class="today-note">${isTennis?'Día de tenis — almuerzo sin hidrato · cena con hidrato':'Día normal — almuerzo con hidrato · cena sin hidrato'}</div>
  </div>`;

  // Activity
  h+=`<div class="card" style="padding:14px;margin-bottom:10px">
    <div style="font-size:13px;font-weight:600;color:#1a1a18;margin-bottom:8px">Actividad de hoy 💪</div>
    <div class="act-grid">
      ${(ACTS_BY_DOW[dow]||[]).map(a=>`<button class="act-btn${savedAct===a?' selected':''}" onclick="selectAct('${a.replace(/'/g,"\'")}')">${a}</button>`).join('')}
    </div>
    ${savedAct?`<div style="font-size:11px;color:#1D9E75;margin-top:8px;font-weight:600">✓ ${savedAct}</div>`:''}
  </div>`;

  function optBtn(meal,key,val){
    const sel=isSelected(log,meal,key,val);
    const vEsc=val.replace(/'/g,"\'");
    return `<button class="opt-btn${sel?' selected':''}" onclick="toggleMealOpt('${meal}','${key}','${vEsc}')"><span class="check">${sel?'✓':''}</span><span>${val}</span></button>`;
  }

  const mealOrder=['pre_entreno','desayuno','colacion_m','almuerzo','colacion_t','merienda','cena'];
  mealOrder.forEach(mk=>{
    const m=NUTRITION[mk];
    if(!m)return;
    const isOpen=!!openMeals[mk];
    const mLog=log[mk]||{};
    const hasData=Object.keys(mLog).length>0&&!(Object.keys(mLog).length===1&&mLog.free==='');
    
    h+=`<div class="meal-card">
      <div class="meal-header" onclick="toggleMeal('${mk}')">
        <div>
          <div class="meal-title">${m.label}</div>
          <div class="meal-time">${m.time}${hasData?' · <span style=color:#1D9E75;font-weight:600>✓</span>':''}</div>
        </div>
        <span style="font-size:18px;color:#ccc">${isOpen?'▲':'▽'}</span>
      </div>
      <div class="meal-body${isOpen?' open':''}">`;

    if(mk==='pre_entreno'){
      h+=`<div class="meal-note green">🍌 Siempre: 1 banana a las 6:30 AM</div>`;
      h+=optBtn(mk,'done','✓ Ya me la comí');
    }

    if(m.note)h+=`<div class="meal-note green">${m.note}</div>`;
    if(mk==='almuerzo')h+=`<div class="meal-note${isTennis?'':' green'}">${isTennis?m.note_tenis:m.note_normal}</div>`;
    if(mk==='cena')h+=`<div class="meal-note${isTennis?' green':''}">${isTennis?m.note_tenis:m.note_normal}</div>`;

    if(m.bebida){h+=`<div class="meal-section">Bebida</div>`;m.bebida.forEach(v=>h+=optBtn(mk,'bebida',v));}
    if(m.saladas){h+=`<div class="meal-section">Opciones saladas</div>`;m.saladas.forEach(v=>h+=optBtn(mk,'salada',v));}
    if(m.dulces){h+=`<div class="meal-section">Opciones dulces</div>`;m.dulces.forEach(v=>h+=optBtn(mk,'dulce',v));}
    if(m.hidratos&&mk==='desayuno'){h+=`<div class="meal-section">Hidratos</div>`;m.hidratos.forEach(v=>h+=optBtn(mk,'hidrato',v));}
    if(m.proteinas&&mk==='desayuno'){h+=`<div class="meal-section">Proteína</div>`;m.proteinas.forEach(v=>h+=optBtn(mk,'proteina',v));}
    if(m.toppings){h+=`<div class="meal-section">Toppings</div>`;m.toppings.forEach(v=>h+=optBtn(mk,'topping',v));}
    if(m.fibra){h+=`<div class="meal-section">Fibra</div>`;m.fibra.forEach(v=>h+=optBtn(mk,'fibra',v));}
    if(m.opciones){h+=`<div class="meal-section">Opciones</div>`;m.opciones.forEach(v=>h+=optBtn(mk,'opcion',v));}
    
    if(m.proteinas&&(mk==='almuerzo'||mk==='cena')){
      h+=`<div class="meal-section">Proteína</div>`;m.proteinas.forEach(v=>h+=optBtn(mk,'proteina',v));
      h+=`<div class="meal-section">Verduras (medio plato)</div>`;m.verduras.forEach(v=>h+=optBtn(mk,'verdura',v));
      const showH=(mk==='almuerzo'&&!isTennis)||(mk==='cena'&&isTennis);
      if(showH){h+=`<div class="meal-section">Hidrato</div>`;m.hidratos.forEach(v=>h+=optBtn(mk,'hidrato',v));}
      h+=`<div class="meal-section">Aceite + postre</div>`;
      h+=optBtn(mk,'extra','1 cda sopera de aceite');
      h+=optBtn(mk,'extra','1 fruta de postre');
    }

    const freeVal=(mLog.free||'').replace(/"/g,'&quot;');
    h+=`<div class="meal-section">¿Comiste algo diferente al plan?</div>
      <input class="free-input" type="text" placeholder="Escribí lo que comiste..." value="${freeVal}" oninput="setFreeText('${mk}',this.value)">`;

    h+=`</div></div>`;
  });

  document.getElementById('view-comida').innerHTML=h;
}

const ACTS_BY_DOW = {
  0:["Gimnasio 🏋️","Tenis 🎾","Caminata 🚶","Otro deporte","Descanso activo","Nada"],
  1:["Gym + Tenis 🏋️🎾","Solo gimnasio 🏋️","Solo tenis 🎾","Nada"],
  2:["Gimnasio 🏋️","Rutina en casa 🏠","Caminata 🚶","Nada"],

  4:["Gimnasio 🏋️","Rutina en casa 🏠","Caminata 🚶","Nada"],
  5:["Partido de tenis 🎾","Caminata 🚶","Otro deporte","Nada"],
  6:["Partido de tenis 🎾","Caminata 🚶","Otro deporte","Nada"]
};

const TENNIS_DAYS = [1,3];
const DAYS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS_ES_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let todayLog = JSON.parse(localStorage.getItem('todayLog_'+getTodayKey())||'{}');
let openMeals = {};

function getTodayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function isTennisDayToday(){
  return TENNIS_DAYS.includes(new Date().getDay());
}

function saveTodayLog(){
  localStorage.setItem('todayLog_'+getTodayKey(), JSON.stringify(todayLog));
}

function toggleMeal(id){
  openMeals[id] = !openMeals[id];
  renderHoy();
}

function selectAct(act){
  todayLog.activity = act;
  saveTodayLog();
  renderHoy();
}

function selectMealOpt(meal, key, val){
  if(!todayLog[meal]) todayLog[meal]={};
  if(!todayLog[meal][key]) todayLog[meal][key]=[];
  const arr = todayLog[meal][key];
  const idx = arr.indexOf(val);
  if(idx>=0) arr.splice(idx,1);
  else arr.push(val);
  saveTodayLog();
  renderHoy();
}

function setFreeText(meal, val){
  if(!todayLog[meal]) todayLog[meal]={};
  todayLog[meal].free = val;
  saveTodayLog();
}

function isSelected(meal, key, val){
  return todayLog[meal]&&todayLog[meal][key]&&todayLog[meal][key].includes(val);
}

function renderOptionList(meal, key, items){
  return items.map(item=>`
    <button class="opt-btn${isSelected(meal,key,item)?' selected':''}" onclick="selectMealOpt('${meal}','${key}','${item.replace(/'/g,"\'")}')">
      <span class="check">${isSelected(meal,key,item)?'✓':''}</span>
      <span>${item}</span>
    </button>`).join('');
}

function renderHoy(){
  const today = new Date();
  const dow = today.getDay();
  const isTennis = TENNIS_DAYS.includes(dow);
  const savedAct = todayLog.activity||'';

  let h = '';

  // Date header
  h += `<div class="act-card" style="padding:12px 14px 10px">
    <div class="today-date">${DAYS_ES[dow]}, ${today.getDate()} de ${MONTHS_ES_FULL[today.getMonth()]}</div>
    <div class="today-dow">${isTennis?'Día de tenis 🎾 — almuerzo sin hidrato, cena con hidrato':'Día normal — almuerzo con hidrato, cena sin hidrato'}</div>
  </div>`;

  // Activity
  h += `<div class="act-card">
    <div style="font-size:13px;font-weight:600;color:#1a1a18;margin-bottom:8px">¿Qué hiciste hoy? 💪</div>
    <div class="act-grid">
      ${(ACTS_BY_DOW[dow]||[]).map(a=>`<button class="act-btn${savedAct===a?' selected':''}" onclick="selectAct('${a.replace(/'/g,"\'")}'">${a}</button>`).join('')}
    </div>
    ${savedAct?`<div style="font-size:11px;color:#1D9E75;margin-top:8px;font-weight:600">✓ Registrado: ${savedAct}</div>`:''}
  </div>`;

  // Meals
  const mealKeys = ['pre_entreno','desayuno','colacion_m','almuerzo','colacion_t','merienda','cena'];
  mealKeys.forEach(mk=>{
    const m = NUTRITION[mk];
    const isOpen = openMeals[mk];
    const hasSaved = todayLog[mk]&&(Object.keys(todayLog[mk]).length>0);

    h += `<div class="meal-card">
      <div class="meal-header" onclick="toggleMeal('${mk}')">
        <div>
          <div class="meal-title">${m.label}</div>
          <div class="meal-time">${m.time}${hasSaved?' · <span style=color:#1D9E75>✓ registrado</span>':''}</div>
        </div>
        <span style="color:#ccc;font-size:16px">${isOpen?'▲':'▽'}</span>
      </div>
      <div class="meal-body${isOpen?' open':''}">`;

    // Fixed
    if(m.fixed){
      h += `<div class="meal-note green">Fijo siempre — ${m.options[0]}</div>`;
      const saved = todayLog[mk]&&todayLog[mk].done;
      h += `<button class="opt-btn${saved?' selected':''}" onclick="selectMealOpt('${mk}','done','si')">
        <span class="check">${saved?'✓':''}</span>
        <span>✓ Lo comí</span>
      </button>`;
    }

    // Bebida
    if(m.bebida){
      h += `<div class="meal-section">Bebida</div>`;
      h += renderOptionList(mk,'bebida',m.bebida);
    }

    // Note for almuerzo/cena
    if(mk==='almuerzo'){
      h += `<div class="meal-note${isTennis?'':' green'}">${isTennis?m.note_tenis:m.note_normal}</div>`;
    }
    if(mk==='cena'){
      h += `<div class="meal-note${isTennis?' green':''}">${isTennis?m.note_tenis:m.note_normal}</div>`;
    }

    // Opciones armadas (desayuno/merienda)
    if(m.saladas){
      h += `<div class="meal-section">Opciones saladas</div>`;
      h += renderOptionList(mk,'salada',m.saladas);
      h += `<div class="meal-section">Opciones dulces</div>`;
      h += renderOptionList(mk,'dulce',m.dulces);
    }

    // Colaciones
    if(m.options){
      h += `<div class="meal-section">Opciones</div>`;
      h += renderOptionList(mk,'opcion',m.options);
    }

    // Almuerzo/cena structure
    if(m.proteinas){
      h += `<div class="meal-section">Proteína (elegí una)</div>`;
      h += renderOptionList(mk,'proteina',m.proteinas);
      h += `<div class="meal-section">Verduras (medio plato)</div>`;
      h += renderOptionList(mk,'verdura',m.verduras);
      const showHidratos = (mk==='almuerzo' && !isTennis) || (mk==='cena' && isTennis);
      if(showHidratos){
        h += `<div class="meal-section">Hidrato (elegí uno)</div>`;
        h += renderOptionList(mk,'hidrato',m.hidratos);
      }
      h += `<div class="meal-section">Aceite + postre</div>`;
      h += `<button class="opt-btn${isSelected(mk,'extra','aceite')?' selected':''}" onclick="selectMealOpt('${mk}','extra','aceite')"><span class="check">${isSelected(mk,'extra','aceite')?'✓':''}</span><span>1 cda sopera aceite</span></button>`;
      h += `<button class="opt-btn${isSelected(mk,'extra','fruta')?' selected':''}" onclick="selectMealOpt('${mk}','extra','fruta')"><span class="check">${isSelected(mk,'extra','fruta')?'✓':''}</span><span>1 fruta de postre</span></button>`;
    }

    // Free text
    const freeVal = todayLog[mk]&&todayLog[mk].free||'';
    h += `<div class="meal-section">¿Comiste algo distinto al plan?</div>
      <input class="free-input" type="text" placeholder="Escribí lo que comiste..." value="${freeVal.replace(/"/g,'&quot;')}" 
        onchange="setFreeText('${mk}',this.value)" oninput="setFreeText('${mk}',this.value)">`;

    h += `</div></div>`;
  });

  document.getElementById('view-hoy').innerHTML = h;
}

render();
