<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D9E75">
<title>Mi rutina</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a18;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 80px}
.topbar{background:#fff;border-bottom:1px solid #e5e5e0;padding:16px 20px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:600;color:#1a1a18}
.topbar p{font-size:12px;color:#888;margin-top:2px}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e5e5e0;position:sticky;top:61px;z-index:99}
.tab{flex:1;padding:12px;font-size:13px;border:none;background:transparent;cursor:pointer;color:#888;border-bottom:2px solid transparent;font-weight:500}
.tab.active{color:#1D9E75;border-bottom-color:#1D9E75}
.content{padding:16px}
.month-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.m-pill{padding:10px 6px;border-radius:12px;border:1px solid #e5e5e0;cursor:pointer;text-align:center;background:#fff}
.m-pill.active{background:#1D9E75;border-color:#1D9E75}
.m-pill.active .m-name,.m-pill.active .m-sub{color:#fff}
.m-name{font-size:13px;font-weight:600;color:#1a1a18}
.m-sub{font-size:10px;color:#888;margin-top:2px}
.month-note{background:#E1F5EE;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#085041;line-height:1.5}
.day-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.d-pill{padding:10px 4px;border-radius:10px;border:1px solid #e5e5e0;cursor:pointer;text-align:center;background:#fff}
.d-pill.active{background:#1D9E75;border-color:#1D9E75}
.d-pill.active .d-name,.d-pill.active .d-focus{color:#fff}
.d-pill.opt{border-style:dashed}
.d-name{font-size:12px;font-weight:600;color:#1a1a18}
.d-focus{font-size:10px;color:#888;margin-top:1px}
.session-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.session-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75}
.ex-card{background:#fff;border-radius:14px;border:1px solid #e5e5e0;margin-bottom:10px;overflow:hidden}
.ex-card.swapped-temp{border-color:#EF9F27}
.ex-card.swapped-perm{border-color:#1D9E75}
.ex-main{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ex-num{width:26px;height:26px;border-radius:50%;border:1px solid #e5e5e0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#888;flex-shrink:0}
.ex-body{flex:1}
.ex-name{font-size:14px;font-weight:600;color:#1a1a18;line-height:1.3}
.ex-card.swapped-temp .ex-name{color:#854F0B}
.ex-card.swapped-perm .ex-name{color:#085041}
.ex-detail{font-size:12px;color:#888;margin-top:2px}
.ex-tempo{font-size:11px;color:#1D9E75;margin-top:3px;font-style:italic}
.ex-fallo{font-size:11px;color:#E24B4A;margin-top:2px;font-weight:600}
.ex-badge{font-size:10px;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:4px;font-weight:600}
.badge-temp{background:#FAEEDA;color:#412402}
.badge-perm{background:#E1F5EE;color:#04342C}
.ex-arrow{font-size:18px;color:#ccc;transition:transform 0.15s;flex-shrink:0}
.ex-arrow.open{transform:rotate(180deg)}
.alts-panel{border-top:1px solid #f0f0ec;background:#fafaf8;padding:12px 16px;display:none}
.alts-panel.open{display:block}
.alts-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.alt-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ec}
.alt-row:last-child{border-bottom:none}
.alt-info{flex:1}
.alt-name{font-size:13px;font-weight:500;color:#1a1a18}
.alt-why{font-size:11px;color:#888;margin-top:2px;line-height:1.4}
.alt-btns{display:flex;gap:5px;flex-shrink:0}
.btn-hoy{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid #EF9F27;color:#854F0B;background:#FAEEDA;cursor:pointer;font-weight:600;white-space:nowrap}
.btn-siempre{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid #1D9E75;color:#085041;background:#E1F5EE;cursor:pointer;font-weight:600;white-space:nowrap}
.btn-reset{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid #e5e5e0;color:#888;background:#fff;cursor:pointer;margin-top:10px;display:block;width:100%;text-align:center}
.deload-card{background:#FAEEDA;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:#412402;line-height:1.5}
.deload-title{font-weight:700;margin-bottom:4px}
.eval-card{background:#E1F5EE;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:#085041;line-height:1.5}
.goal{font-size:11px;color:#1D9E75;font-weight:700;margin-top:3px}
.hist-section-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin:16px 0 10px}
.hist-card{border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid}
.hist-card.perm{background:#E1F5EE;border-color:#1D9E75}
.hist-card.temp{background:#FAEEDA;border-color:#EF9F27}
.hist-day{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px}
.hist-card.perm .hist-day{color:#0F6E56}
.hist-card.temp .hist-day{color:#854F0B}
.hist-name{font-size:14px;font-weight:600}
.hist-card.perm .hist-name{color:#085041}
.hist-card.temp .hist-name{color:#633806}
.hist-orig{font-size:12px;color:#888;margin-top:2px}
.empty{text-align:center;padding:40px 0;color:#aaa;font-size:14px}
.badge-block{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em}
.badge-base{background:#E1F5EE;color:#085041}
.badge-rot{background:#EEEDFE;color:#26215C}
.badge-fuerza{background:#FAECE7;color:#4A1B0C}
.badge-cierre{background:#E6F1FB;color:#042C53}
</style>
</head>

const DAYS_ORDER=['lun','mar','mie','jue','vie'];
const DAY_META={lun:{n:'Lun',f:'Glúteos'},mar:{n:'Mar',f:'Espalda'},mie:{n:'Mié',f:'Cuáds'},jue:{n:'Jue',f:'Hombros'},vie:{n:'Vie',f:'Opcional'}};
const BADGE={base:'badge-base',rot:'badge-rot',fuerza:'badge-fuerza',cierre:'badge-cierre'};

let curTab='plan',curMonth='sep',curDay='lun',openAlt=null;
let swaps={},permSwaps={};

function setTab(t,el){
  curTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  ['plan','rutina','cambios'].forEach(v=>{
    document.getElementById('view-'+v).style.display=v===t?'block':'none';
  });
  render();
}

function setMonth(m,el){
  curMonth=m;curDay='lun';openAlt=null;
  document.querySelectorAll('.m-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setDay(d){curDay=d;openAlt=null;render();}

function toggleAlt(id){openAlt=openAlt===id?null:id;render();}

function doSwap(exId,altName,perm){
  const day=MONTHS[curMonth].days[curDay];
  const ex=day.exs.find(e=>e.n===exId);
  const alt=ex.alts.find(a=>a.n===altName);
  const key=curMonth+'_'+curDay+'_'+exId;
  if(perm){
    permSwaps[key]={display:altName,orig:exId,why:alt.w,day:curDay,month:curMonth};
    delete swaps[key];
  } else {
    if(!permSwaps[key]) swaps[key]={display:altName,orig:exId,why:alt.w,day:curDay,month:curMonth};
  }
  openAlt=null;render();
}

function resetSwap(exId){
  const key=curMonth+'_'+curDay+'_'+exId;
  delete swaps[key];delete permSwaps[key];render();
}

function render(){
  if(curTab==='plan') renderPlan();
  else if(curTab==='rutina') renderRutina();
  else renderCambios();
}

function renderPlan(){
  const m=MONTHS[curMonth];
  const day=m.days[curDay];
  let h='';
  h+=`<div class="month-strip">`;
  Object.entries(MONTHS).forEach(([k,v])=>{
    h+=`<div class="m-pill${k===curMonth?' active':''}" onclick="setMonth('${k}',this)"><div class="m-name">${v.label}</div><div class="m-sub">${v.sub}</div></div>`;
  });
  h+=`</div>`;
  h+=`<div class="badge-block ${BADGE[m.badge]}">${m.label} — ${m.sub}</div>`;
  h+=`<div class="month-note">${m.note}</div>`;
  h+=`<div class="day-strip">`;
  DAYS_ORDER.forEach(d=>{
    const meta=DAY_META[d];
    h+=`<div class="d-pill${d===curDay?' active':''}${d==='vie'?' opt':''}" onclick="setDay('${d}')"><div class="d-name">${meta.n}</div><div class="d-focus">${meta.f}</div></div>`;
  });
  h+=`</div>`;
  h+=`<div class="session-label"><div class="session-dot"></div>${day.label}</div>`;
  day.exs.forEach((ex,i)=>{
    const key=curMonth+'_'+curDay+'_'+ex.n;
    const isPerm=!!permSwaps[key];
    const isTemp=!!swaps[key]&&!isPerm;
    const display=isPerm?permSwaps[key].display:isTemp?swaps[key].display:ex.n;
    const cardClass='ex-card'+(isPerm?' swapped-perm':isTemp?' swapped-temp':'');
    const badge=isPerm?'<span class="ex-badge badge-perm">Cambio permanente</span>':isTemp?'<span class="ex-badge badge-temp">Solo hoy</span>':'';
    const isOpen=openAlt===ex.n;
    let altsH=ex.alts.map(a=>`
      <div class="alt-row">
        <div class="alt-info"><div class="alt-name">${a.n}</div><div class="alt-why">${a.w}</div></div>
        <div class="alt-btns">
          <button class="btn-hoy" onclick="doSwap('${ex.n}','${a.n.replace(/'/g,"\\'")}',false)">Hoy</button>
          <button class="btn-siempre" onclick="doSwap('${ex.n}','${a.n.replace(/'/g,"\\'")}',true)">Siempre</button>
        </div>
      </div>`).join('');
    const resetBtn=(isPerm||isTemp)?`<button class="btn-reset" onclick="resetSwap('${ex.n.replace(/'/g,"\\'")}')">Volver al original</button>`:'';
    h+=`<div class="${cardClass}">
      <div class="ex-main" onclick="toggleAlt('${ex.n}')">
        <div class="ex-num">${i+1}</div>
        <div class="ex-body">
          <div class="ex-name">${display}</div>
          <div class="ex-detail">${ex.d||''}</div>
          ${ex.t?`<div class="ex-tempo">${ex.t}</div>`:''}
          ${ex.f?`<div class="ex-fallo">⚡ ${ex.f}</div>`:''}
          ${ex.goal?`<div class="goal">🎯 ${ex.goal}</div>`:''}
          ${badge}
        </div>
        <span class="ex-arrow${isOpen?' open':''}">›</span>
      </div>
      <div class="alts-panel${isOpen?' open':''}">
        <div class="alts-title">Alternativas inteligentes para hoy</div>
        ${altsH}${resetBtn}
      </div>
    </div>`;
  });
  if(m.deload){
    h+=`<div class="deload-card"><div class="deload-title">Semana 4 — descarga obligatoria</div>Solo lunes y miércoles. 2-3 ejercicios por sesión, al 70% del peso, sin llegar al fallo. El cuerpo necesita recuperarse antes de diciembre.</div>`;
  }
  if(m.eval){
    h+=`<div class="eval-card"><div class="deload-title">Semana 4 — evaluación final 🎯</div>Nueva antropometría con Marina. Comparás los números de octubre con los de ahora y planificás el 2026.</div>`;
  }
  document.getElementById('view-plan').innerHTML=h;
}

function renderRutina(){
  document.getElementById('view-rutina').innerHTML=`<div style="text-align:center;padding:40px 0;color:#888;font-size:14px">Usá la pestaña Plan mensual para ver y gestionar tu rutina del día.</div>`;
}

function renderCambios(){
  const perms=Object.values(permSwaps);
  const temps=Object.entries(swaps).filter(([k])=>!permSwaps[k]).map(([,v])=>v);
  let h='';
  h+=`<div class="hist-section-title">Cambios permanentes</div>`;
  h+=perms.length?perms.map(s=>`<div class="hist-card perm"><div class="hist-day">${s.month.toUpperCase()} · ${s.day.toUpperCase()}</div><div class="hist-name">${s.display}</div><div class="hist-orig">Reemplaza: ${s.orig}</div></div>`).join(''):`<div class="empty">Sin cambios permanentes todavía.</div>`;
  h+=`<div class="hist-section-title">Cambios temporales (sesión actual)</div>`;
  h+=temps.length?temps.map(s=>`<div class="hist-card temp"><div class="hist-day">${s.month.toUpperCase()} · ${s.day.toUpperCase()}</div><div class="hist-name">${s.display}</div><div class="hist-orig">Reemplaza: ${s.orig}</div></div>`).join(''):`<div class="empty">Sin cambios temporales hoy.</div>`;
  document.getElementById('view-cambios').innerHTML=h;
}

render();
</script>
</body>
</html>
